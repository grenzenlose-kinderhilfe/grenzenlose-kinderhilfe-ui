name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec astro build
        env:
          # Repository variables (Settings → Secrets and variables → Actions
          # → Variables). The values end up in the public pages, so they are
          # variables rather than secrets. PUBLIC_GOOGLE_SHEET_ID is required.
          PUBLIC_GOOGLE_SHEET_ID: ${{ vars.PUBLIC_GOOGLE_SHEET_ID }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_STRIPE_CUSTOMER_PORTAL_URL: ${{ vars.PUBLIC_STRIPE_CUSTOMER_PORTAL_URL }}

      - uses: actions/upload-artifact@v4
        with:
          path: dist
          if-no-files-found: error
          name: grenzenlose-kinderhilfe-${{ github.sha }}
